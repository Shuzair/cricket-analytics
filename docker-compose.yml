version: '3.8'

networks:
  cricket_net:
    name: cricket_net

services:
  postgres:
    image: postgres:16
    container_name: cricket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cricket123}
      POSTGRES_DB: ${DB_NAME:-cricket}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cricket_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cricket_net

  spark:
    image: bitnami/spark:3.5
    container_name: cricket_spark
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-cricket}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-cricket123}
      JDBC_JAR_PATH: /opt/bitnami/spark/jars/postgresql.jar
    volumes:
      - ./data:/opt/spark/data
      - ./scripts:/opt/spark/scripts
      - ./jars/postgresql-42.7.4.jar:/opt/bitnami/spark/jars/postgresql.jar:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cricket_net

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: cricket_dbt
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-cricket}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-cricket123}
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt
    entrypoint: ["dbt"]
    command: ["--help"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cricket_net

volumes:
  cricket_data:
    name: cricket_postgres_data
