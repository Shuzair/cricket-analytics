version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cricket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cricket123}
      POSTGRES_DB: ${DB_NAME:-cricket}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cricket_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d  # Auto-run SQL files on first start
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro  # Custom config for monitoring
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cricket_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cricket.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"  # Desktop mode (simpler)
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin_servers.json:/pgadmin4/servers.json  # Auto-configure server connection
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cricket_data:
    name: cricket_postgres_data
  pgadmin_data:
    name: cricket_pgadmin_data
