# PostgreSQL Configuration for Cricket Analytics
# This config enables monitoring and performance tracking

# -----------------------------
# CONNECTIONS
# -----------------------------
listen_addresses = '*'
max_connections = 100

# -----------------------------
# MEMORY
# -----------------------------
shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB

# -----------------------------
# MONITORING & STATISTICS
# -----------------------------
# Enable statistics collection
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# pg_stat_statements - tracks query performance
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# -----------------------------
# LOGGING (for debugging/monitoring)
# -----------------------------
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'mod'              # Log INSERT/UPDATE/DELETE
log_duration = on                   # Log query duration
log_min_duration_statement = 500    # Log queries taking > 500ms
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                  # Log all temp files

# -----------------------------
# QUERY TUNING
# -----------------------------
random_page_cost = 1.1              # For SSD storage
effective_io_concurrency = 200      # For SSD storage

# -----------------------------
# AUTOVACUUM (keeps DB healthy)
# -----------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
